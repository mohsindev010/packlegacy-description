<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Brown kraft board with natural fibre texture swatch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f3"/><stop offset="1" stop-color="#d6d9de"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a073"/><stop offset="1" stop-color="#b3875a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".2"/>
    </filter>
    <filter id="fibre">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .35 0"/>
    </filter>
    <clipPath id="board"><path d="M20 160 270 25h130v100L150 215z"/></clipPath>
    <clipPath id="swatch"><circle cx="335" cy="185" r="50"/></clipPath>
  </defs>

  <rect width="400" height="250" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <path d="M20 160 270 25h130v100L150 215z" fill="url(#top)"/>
    <path d="M20 160l130 55v10L20 170z" fill="#94693f"/>
    <path d="M150 215l250-90v10l-250 90z" fill="#a37848"/>
  </g>
  <rect width="400" height="250" filter="url(#fibre)" clip-path="url(#board)" opacity=".5"/>

  <circle cx="335" cy="185" r="54" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#swatch)">
    <rect x="285" y="135" width="100" height="100" fill="#c2966a"/>
    <rect x="285" y="135" width="100" height="100" filter="url(#fibre)"/>
  </g>
</svg>
