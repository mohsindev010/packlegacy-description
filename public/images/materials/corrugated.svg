<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Corrugated cardboard sheet with fluted cross-section swatch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f3"/><stop offset="1" stop-color="#d6d9de"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d9ab76"/><stop offset="1" stop-color="#c4915a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".2"/>
    </filter>
    <!-- flutes: wavy middle layer between two liners, rotated to follow each cut edge -->
    <pattern id="flute-r" width="14" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(150 215) rotate(-19.8)">
      <rect width="14" height="24" fill="#a8743f"/>
      <path d="M0 4c3.5 0 3.5 16 7 16s3.5-16 7-16" fill="none" stroke="#e2b680" stroke-width="2.2"/>
      <path d="M0 1.5h14M0 22.5h14" stroke="#d29f66" stroke-width="3"/>
    </pattern>
    <pattern id="flute-l" width="14" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(20 160) rotate(22.9)">
      <rect width="14" height="24" fill="#93622f"/>
      <path d="M0 4c3.5 0 3.5 16 7 16s3.5-16 7-16" fill="none" stroke="#cf9f68" stroke-width="2.2"/>
      <path d="M0 1.5h14M0 22.5h14" stroke="#bf8c52" stroke-width="3"/>
    </pattern>
    <clipPath id="swatch"><circle cx="335" cy="185" r="50"/></clipPath>
  </defs>

  <rect width="400" height="250" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <path d="M20 160 270 25h130v100L150 215z" fill="url(#top)"/>
    <path d="M20 160l130 55v26L20 186z" fill="url(#flute-l)"/>
    <path d="M150 215l250-90v26l-250 90z" fill="url(#flute-r)"/>
  </g>

  <!-- cross-section swatch -->
  <circle cx="335" cy="185" r="54" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#swatch)">
    <rect x="285" y="135" width="100" height="100" fill="#d8aa74"/>
    <rect x="285" y="166" width="100" height="40" fill="#8f5e2c"/>
    <path d="M280 186q8-32 16 0t16 0 16 0 16 0 16 0 16 0 16 0" fill="none" stroke="#e0b47e" stroke-width="3.5"/>
    <rect x="285" y="160" width="100" height="7" fill="#c99358"/>
    <rect x="285" y="205" width="100" height="7" fill="#c99358"/>
  </g>
</svg>
